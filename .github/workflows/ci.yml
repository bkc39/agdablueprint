name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: black (formatting)
        run: nix develop --command black --check src tests
      - name: pyright (type checking)
        run: nix develop --command pyright

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Build the package (runs the pytest checkPhase) and the devShell.
      - name: Build package
        run: nix build .#agdablueprint --print-build-logs
      - name: Run tests in devShell
        run: nix develop --command pytest -q
