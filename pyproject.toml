[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agdablueprint"
version = "0.0.1"
description = "Blueprint-style coordination tooling for Agda formalization projects"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The agdablueprint authors" }]
keywords = ["agda", "blueprint", "formalization", "plastex", "dependency-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "plasTeX>=3.0",
    "plastexdepgraph>=0.0.4",
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/bkc39/agdablueprint"
Repository = "https://github.com/bkc39/agdablueprint"

[project.scripts]
agdablueprint = "agdablueprint.cli:cli"

# Entry point so plasTeX discovers the plugin: `plastex --plugins=agdablueprint`.
[project.entry-points."plastex.plugins"]
agdablueprint = "agdablueprint"

[tool.hatch.build.targets.wheel]
# The macros/, templates/, and static/ data directories live inside the
# package and are picked up automatically.
packages = ["src/agdablueprint"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 80

[tool.pyright]
include = ["src", "tests"]
